<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Sentiment Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #a1c4fd, #c2e9fb);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 600px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 10px;
      resize: none;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #218838;
    }

    .result {
      margin-top: 30px;
      text-align: center;
      font-size: 20px;
      color: #444;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI Sentiment Detector</h1>
    <form method="POST">
      <textarea name="message" placeholder="Enter your message here...">{{ message }}</textarea>
      <button type="submit">Detect Sentiment</button>
    </form>
    
    {% if sentiment %}
    <div class="result">
      Sentiment: {{ sentiment }}
    </div>
    {% endif %}
  </div>
</body>
</html>
